# ᴍɪɴᴛ ᴘᴠᴘ configuration
# Colours use hex (#RRGGBB). Text sent by the plugin is rendered in small caps.

theme:
  primary: "#98F5C0"    # light mint
  secondary: "#5FD8A0"  # deeper mint
  accent: "#E6FFF0"     # near-white mint
  muted: "#7FA896"      # grey-green

server-name: "Mint PvP"

combat:
  tag-seconds: 15
  block-commands: true
  allowed-commands: ["msg", "r", "stats", "leaderboard"]
  kill-on-logout: true

kit:
  default: classic          # kit used for join/respawn kits and as the fallback
  # Kits themselves are created in-game (/kit create <name>) and stored in kits.yml.
  # Keep these off on a server where players have real inventories (e.g. an SMP):
  # giving a kit REPLACES the player's inventory.
  give-on-join: false
  give-on-respawn: false

gameplay:
  keep-inventory: true      # nothing drops on death; kit is restored
  heal-killer: 4.0          # hearts' worth of HP (in half-hearts) healed on kill
  instant-respawn: true
  streak-announce-every: 5  # broadcast every N-kill streak

duel:
  countdown-seconds: 5
  request-expire-seconds: 30
  default-arena-radius: 40    # half-width (blocks) of the square border; override with /arena setradius
  default-arena-height: 25    # blocks above AND below the arena centre's Y (floor/ceiling)
  clear-mobs: true            # remove mobs from the arena at start and keep it clear during the duel
  allow-spectators: true
  max-spectators: 20          # per duel; 0 = unlimited
  announce-start: true        # broadcast a clickable [watch] when a duel starts
  protect-terrain: true       # arenas are wilderness: no breaking/placing/fire during duels
  max-duration-seconds: 300   # duel ends in a draw after this long
  allowed-commands: ["duel", "msg", "r"]

ranked:
  enabled: true
  k-factor: 32                 # how many points a result is worth (higher = bigger swings)
  window-base: 100             # starting allowed Elo difference between matched players
  window-step: 50              # the window widens by this much...
  window-interval-seconds: 10  # ...every this many seconds spent waiting
  window-max: 800

spawn:
  teleport-on-join: true       # needs /setspawn first
  teleport-on-respawn: true

lobby:
  # Gives the hotbar menu (iron sword = queue, etc.) on join and respawn.
  # WARNING: this REPLACES the player's inventory. Turn it off on a survival/SMP world.
  give-items: true
  # Lobby players (not in a duel) take no damage or hunger and can't build/drop/move items.
  # Players with mintpvp.build (ops by default) are exempt from the build restrictions.
  protect: true
