name: MintPvP
version: '${project.version}'
main: dev.mintpvp.MintPvP
api-version: '26.3'
authors: [MintPvP]
description: ᴍɪɴᴛ ᴘᴠᴘ - a fresh mint-green PvP experience.
commands:
  mintpvp:
    description: Main Mint PvP command.
    aliases: [mint, mpvp]
    usage: /<command> [help|reload]
  stats:
    description: View PvP stats.
    usage: /<command> [player]
  leaderboard:
    description: View the top players.
    aliases: [lb, top]
    usage: /<command> [elo|wins|kills|kd|streak]
  kit:
    description: Edit your kit layouts (admins can also manage kits).
    aliases: [kits, layout]
    usage: /<command> [layout <kit>] | create|delete|seticon|update|edit|list|admin
  spawn:
    description: Teleport to the lobby spawn.
    aliases: [lobby, hub]
    usage: /<command>
  build:
    description: Turn builder mode on or off (lets you build and break in the lobby).
    aliases: [buildmode]
    usage: /<command>
  setspawn:
    description: Set the lobby / world spawn to your location.
    usage: /<command>
  queue:
    description: Join the random duel queue.
    aliases: [q]
    usage: /<command> [kit|leave|ranked [kit]|unranked [kit]]
  menu:
    description: Open the duels menu.
    aliases: [duels, play]
    usage: /<command>
  duel:
    description: Challenge a player to a duel.
    usage: /<command> [player] [kit] [arena] | accept [player] | deny [player] | forfeit
  challenge:
    description: Challenge a player to a ranked duel.
    aliases: [ranked]
    usage: /<command> [player] [kit]
  party:
    description: Create and manage a party, and duel other parties.
    usage: /<command> [create|invite|accept|deny|leave|kick|disband|promote|list|duel]
  pc:
    description: Party chat.
    usage: /<command> <message>
  spectate:
    description: Watch a running duel.
    aliases: [spec, watch]
    usage: /<command> [player|arena|leave]
  arena:
    description: Manage duel arenas.
    usage: /<command> <create|delete|setspawn1|setspawn2|setcenter|setradius|setheight|check|list|tp|themes|generate|lobby|reset> [name]
permissions:
  mintpvp.admin:
    description: Reload and administer Mint PvP.
    default: op
  mintpvp.build:
    description: Allows /build (builder mode) to build, break and drop items in the lobby.
    default: op
  mintpvp.spectate:
    description: Spectate duels.
    default: true
  mintpvp.duel:
    description: Send and accept duels.
    default: true
  mintpvp.bypass.combat:
    description: Ignore combat tag command blocking.
    default: op
