# ᴍɪɴᴛ ᴘᴠᴘ configuration
# Colours use hex (#RRGGBB). Text sent by the plugin is rendered in small caps.

theme:
  primary: "#98F5C0"    # light mint
  secondary: "#5FD8A0"  # deeper mint
  accent: "#E6FFF0"     # near-white mint
  muted: "#7FA896"      # grey-green

server-name: "Mint PvP"

combat:
  tag-seconds: 15
  block-commands: true
  allowed-commands: ["msg", "r", "stats", "leaderboard"]
  kill-on-logout: true

kit:
  default: classic          # kit used for join/respawn kits and as the fallback
  # Kits themselves are created in-game (/kit create <name>) and stored in kits.yml.
  # Keep these off on a server where players have real inventories (e.g. an SMP):
  # giving a kit REPLACES the player's inventory.
  give-on-join: false
  give-on-respawn: false

gameplay:
  keep-inventory: true      # nothing drops on death; kit is restored
  heal-killer: 4.0          # hearts' worth of HP (in half-hearts) healed on kill
  instant-respawn: true
  streak-announce-every: 5  # broadcast every N-kill streak

duel:
  countdown-seconds: 5
  request-expire-seconds: 30
  default-arena-radius: 40    # half-width (blocks) of the square border; override with /arena setradius
  height-limit: false         # false = no floor/ceiling: players can go as high or low as the world allows
  default-arena-height: 25    # only used when height-limit is true (blocks above AND below the arena centre)
  clear-mobs: true            # remove mobs from the arena at start and keep it clear during the duel
  allow-spectators: true
  max-spectators: 20          # per duel; 0 = unlimited
  announce-start: true        # broadcast a clickable [watch] when a duel starts
  allow-building: true        # duelists can place and break blocks; the arena is put back when the duel ends
  max-duration-seconds: 300   # time limit for a duel (0 = none)
  timeout-winner-by-health: true  # at the time limit the player with more health wins; only an exact tie is a draw
  end-delay-seconds: 4        # after a kill, the fight winds down this long (victory/defeat titles) before everyone is sent back; 0 = instant
  allowed-commands: ["duel", "msg", "r"]

ranked:
  enabled: true
  k-factor: 32                 # points per result once you're established (see the adaptive settings below)
  # Adaptive Elo: new players swing a lot, veterans less, and win streaks pay extra.
  provisional-games: 10        # your first this-many ranked games use k-provisional
  k-provisional: 64
  settling-games: 30           # up to this many ranked games use k-settling
  k-settling: 40
  top-elo: 1900                # at or above this (once settled) the steadier k-top is used
  k-top: 20
  window-base: 100             # starting allowed Elo difference between matched players
  window-step: 50              # the window widens by this much...
  window-interval-seconds: 10  # ...every this many seconds spent waiting
  window-max: 800
  challenge-limit-per-hour: 5  # max ranked /challenge duels between the same two players per hour (stops win-trading; 0 = unlimited)

spawn:
  teleport-on-join: true       # needs /setspawn first
  teleport-on-respawn: true

lobby:
  # Gives the hotbar menu (iron sword = queue, etc.) on join and respawn.
  # WARNING: this REPLACES the player's inventory. Turn it off on a survival/SMP world.
  give-items: true
  # Lobby players (not in a duel) take no damage or hunger and can't build/drop/move items.
  # Players with mintpvp.build (ops by default) are exempt from the build restrictions.
  protect: true

arena-generator:
  # Pre-made arenas (Plains, Desert, Poplar Grove, Snowy, Cherry Grove) in their own generated world.
  # The terrain goes down to bedrock with stone, deepslate, caves and ores. After every duel a
  # generated arena is reset completely. Your other worlds are never touched.
  enabled: true
  world-name: mint_arenas_2  # the old 'world' setting is ignored; old generated arenas are dropped
  lobby: true                # generate the mint lobby island and use it as the spawn (if none is set)
  per-theme: 2               # normal (unranked) arenas made per theme on start, 75 blocks across
  ranked-per-theme: 1        # big ranked arenas made per theme on start
  ranked-radius-min: 100     # ranked arenas get a random radius in this range
  ranked-radius-max: 150
  max-total: 30              # more are made on demand when all are busy, up to this many

party:
  max-size: 6
  invite-expire-seconds: 60
  allow-uneven-teams: true      # parties of different sizes can duel (2v1, 3v2...); false = same size only
  friendly-fire: false          # can teammates hurt each other?
  ffa-min-players: 3            # a party free-for-all needs at least this many players in the party
  ffa-large-arena-min-players: 5  # a party free-for-all with this many players uses a big arena
  ffa-max-duration-seconds: 420   # time limit; the player with the most health wins
  large-arena-min-players: 7    # party duels with this many players in total use a big (ranked-size) arena
