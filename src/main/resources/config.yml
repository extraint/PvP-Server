# ᴍɪɴᴛ ᴘᴠᴘ configuration
# hex colours

theme:
  primary: "#98F5C0"    # light mint
  secondary: "#5FD8A0"  # deeper mint
  accent: "#E6FFF0"     # near-white mint
  muted: "#7FA896"      # grey-green

server-name: "Mint PvP"

combat:
  tag-seconds: 15
  block-commands: true
  allowed-commands: ["msg", "r", "stats", "leaderboard"]
  kill-on-logout: true

kit:
  default: classic  # kit used on join
  # kits replace inventory
  give-on-join: false
  give-on-respawn: false

gameplay:
  keep-inventory: true  # no death drops
  heal-killer: 4.0  # heal on kill
  instant-respawn: true
  streak-announce-every: 5  # streak broadcast interval

duel:
  countdown-seconds: 5
  request-expire-seconds: 30
  default-arena-radius: 40  # arena half-width
  height-limit: false  # false = no height limit
  default-arena-height: 25  # used with height-limit
  clear-mobs: true  # clear mobs in arena
  allow-spectators: true
  max-spectators: 20  # 0 = unlimited
  announce-start: true  # clickable watch message
  block-drops: true  # blocks drop items
  allow-building: true  # allow place and break
  end-delay-seconds: 4  # seconds before returning
  round-options: [1, 2, 3, 5, 7, 10]  # first-to choices
  max-rounds: 15  # most rounds allowed
  round-delay-seconds: 3  # seconds between rounds
  round-countdown-seconds: 3  # round countdown seconds
  allowed-commands: ["duel", "msg", "r"]

ranked:
  enabled: true
  # tier ladder
  first-to: 3  # ranked rounds to win
  promote-wins: 2  # wins to promote
  demote-losses: 3  # losses to demote
  streak-bonus-from: 2  # streak bonus threshold
  tier-scaling: true  # elite tiers cost more
  elite-from: ht3  # first elite tier
  elite-window-max: 2  # elite match tier gap
  decay-grace-days: 14  # idle days before decay, 0 = off
  decay-step-days: 7  # days per extra drop
  decay-floor: lt3  # decay stops here
  veto: true  # elite players ban maps
  veto-options: 6  # maps offered
  veto-seconds: 20  # time to choose
  window-base: 1  # starting tier window
  window-step: 1  # window growth
  window-interval-seconds: 10  # seconds per growth
  window-max: 10
  challenge-limit-per-hour: 5  # ranked challenges per hour

spawn:
  teleport-on-join: true  # needs /setspawn
  teleport-on-respawn: true

lobby:
  builder-creative: true  # creative in builder mode
  # lobby hotbar items
  # replaces inventory
  give-items: true
  # lobby protection
  # mintpvp.build exempt
  protect: true

arena-generator:
  # generated arenas
  enabled: true
  world-name: mint_arenas_2  # arena world name
  lobby: true  # generate lobby island
  stadium-kits: [sword, uhc, diamondpotion]  # kits played in the stadium
  stadium-count: 2  # stadium arenas
  per-theme: 2  # normal arenas per theme
  ranked-per-theme: 1  # ranked arenas per theme
  ranked-radius-min: 100  # ranked radius range
  ranked-radius-max: 150
  max-total: 30  # on-demand arena cap

party:
  max-players: 30  # party size cap
  invite-expire-seconds: 60
  allow-uneven-teams: true  # allow uneven teams
  friendly-fire: false  # teammate damage
  ffa-min-players: 3  # free-for-all minimum players
  ffa-large-arena-min-players: 5  # free-for-all big arena
  large-arena-min-players: 7  # big arena party size

region:
  this: na  # na or eu
  servers:
    na: mintpvp.playfps.nl
    eu: eu-mintpvp.mcsh.gg
  link-only: []  # regions shown as a copyable address instead of a transfer

storage:
  type: yaml  # yaml or mysql
  pull-seconds: 60  # refresh from database
  mysql:
    host: localhost
    port: 3306
    database: mintpvp
    user: ""
    password: ""

tags:
  teams: true  # tier tags in nametags and tab
